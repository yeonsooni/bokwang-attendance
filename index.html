<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="청년부 출석부" />
<title>보광중앙교회 청년부 출석부</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- 데스크톱에서만 디바이스 프레임으로 감싸진다 (폰에서는 프레임 없이 전체화면) -->
<div class="device">
<div class="app">

  <header class="app-header">
    <div class="brand">
      <p class="eyebrow"><span id="sync-label">보광중앙교회</span></p>
      <h1>청년부 출석부</h1>
    </div>
    <button id="btn-notes" class="icon-btn has-badge" aria-label="그날의 메모" title="그날의 메모">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
      <span class="badge" id="notes-badge" hidden>0</span>
    </button>
    <button id="btn-settings" class="icon-btn" aria-label="설정" title="설정">
      <svg class="ico-gear" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <svg class="ico-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <main>
    <!-- ────────── 출석 ────────── -->
    <section id="panel-attendance" class="panel is-active" role="tabpanel" aria-label="출석">
      <div class="card hero">
        <div class="date-nav">
          <button id="date-prev" class="icon-btn ghost" aria-label="이전 주">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button id="date-label" class="date-label">
            <span class="d-main">—</span>
            <span class="d-sub">—</span>
          </button>
          <button id="date-next" class="icon-btn ghost" aria-label="다음 주">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <input type="date" id="date-input" aria-label="날짜 선택" />
        </div>

        <div class="hero-stat">
          <p class="count"><strong id="present-count">0</strong><span id="total-count">/ 0명</span></p>
          <p class="rate" id="present-rate">—</p>
        </div>
        <div class="meter"><i id="present-meter" style="width:0%"></i></div>
      </div>

      <div class="toolbar">
        <h2>명단</h2>
        <div class="sortbar" role="radiogroup" aria-label="명단 정렬 기준">
          <button class="sort-opt is-active" data-sort="seat"  role="radio" aria-checked="true">가까이 앉는 대로</button>
          <button class="sort-opt" data-sort="name"  role="radio" aria-checked="false">가나다 순</button>
          <button class="sort-opt" data-sort="group" role="radio" aria-checked="false">소그룹별</button>
        </div>
      </div>

      <div id="attendance-body"></div>

      <button id="btn-save" class="savebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        <span class="txt">저장됨</span>
        <span class="when" id="save-when"></span>
      </button>

      <p class="hint">이름을 <b>탭</b>하면 출석 체크 · <b>길게 누르면</b> 소그룹·수정·삭제</p>
    </section>

    <!-- ────────── 통계 ────────── -->
    <section id="panel-stats" class="panel" role="tabpanel" aria-label="통계">
      <div id="stats-body"></div>
    </section>

    <!-- ────────── 소그룹 ────────── -->
    <section id="panel-groups" class="panel" role="tabpanel" aria-label="소그룹">
      <div id="groups-body"></div>
    </section>
    <!-- ────────── 설정 ────────── -->
    <section id="panel-settings" class="panel" role="tabpanel" aria-label="설정">
      <div id="settings-body"></div>
    </section>
  </main>

  <!-- 하단 플로팅 바 -->
  <nav class="dock" role="tablist">
    <button class="dock-tab is-active" role="tab" data-tab="attendance" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>출석</span>
    </button>
    <button class="dock-tab" role="tab" data-tab="stats" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      <span>통계</span>
    </button>
    <button class="dock-tab" role="tab" data-tab="groups" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>소그룹</span>
    </button>
  </nav>

  <!-- 로그인 — 계정이 없으면 아무것도 안 보인다 -->
  <div id="login" class="login" hidden>
    <div class="login-card">
      <p class="eyebrow">보광중앙교회</p>
      <h2>청년부 출석부</h2>
      <p class="login-sub">리더 계정으로 들어와 주세요.</p>
      <label class="field">아이디
        <input type="text" id="login-email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="예: seohansol" />
      </label>
      <label class="field">비밀번호
        <input type="password" id="login-pw" autocomplete="current-password" placeholder="••••••••" />
      </label>
      <p class="login-msg" id="login-msg" hidden></p>
      <button class="btn primary block" id="login-go">들어가기</button>
      <p class="login-foot">계정은 담당자가 만들어 드립니다.</p>
    </div>
  </div>

  <!-- 공용 모달 -->
  <div id="overlay" class="overlay" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

</div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
